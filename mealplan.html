<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Plan - Food Hackathon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      background: linear-gradient(135deg, #BF808B 0%, #FFC5CF 100%);
      background-attachment: fixed;
      background-size: cover;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #BF808B 0%, #FFC5CF 100%);
      min-height: 100vh;
      color: black;
      padding: 20px;
      background: transparent;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .title {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(45deg, black, #3b241a, black);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Keep the emoji outside the gradient text-fill so it stays a solid color */
    .title-emoji {
      -webkit-background-clip: initial;
      background-clip: initial;
      -webkit-text-fill-color: initial;
      color: inherit; /* let it follow body color unless overridden */
      display: inline-block;
      line-height: 1;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-bottom: 30px;
      color: black;
    }

    .ingredients-section {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .ingredients-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ingredients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .ingredient-tag {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-btn {
      background: linear-gradient(45deg, #b84d52, #9e474b);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
    }

    .recipes-section {
      margin-bottom: 30px;
    }

    /* Stack mode: cards positioned on top of each other so user can swipe through */
    .recipes-grid {
      position: relative;
      width: 100%;
      min-height: 460px; /* reserve space for stack */
      margin-top: 20px;
      display: block;
      perspective: 1200px;
    }

    .stack-card {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: 100%;
      max-width: 700px;
      transition: transform 0.35s ease, opacity 0.35s ease;
      will-change: transform, opacity;
      cursor: grab;
      touch-action: pan-y;
      display: block;
    }

    .stack-card:active {
      cursor: grabbing;
    }

    /* Expanded/fullscreen card state */
    .stack-card.expanded {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      transform: none !important;
      border-radius: 0 !important;
      z-index: 9999 !important;
      overflow: auto;
      box-shadow: none !important;
    }

    .stack-card.expanded .recipe-image {
      height: 40vh;
      object-fit: cover;
    }

    .close-expanded-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 18px;
      display: none;
      z-index: 10000;
      cursor: pointer;
    }

    .stack-card.expanded .close-expanded-btn {
      display: block;
    }

    .stack-controls {
      display: none; /* shown when stack initialized */
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
      align-items: center;
    }

    .stack-controls button {
      background: rgba(0,0,0,0.25);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .recipe-card {
      background: #ffffff; /* opaque card background */
      color: #222;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    .recipe-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    .recipe-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .recipe-content {
      padding: 20px;
    }

    .recipe-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .recipe-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .recipe-ingredients {
      margin-bottom: 15px;
    }

    .recipe-ingredients-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .recipe-ingredients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .recipe-ingredient {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    .recipe-actions {
      display: flex;
      gap: 10px;
    }

    .view-recipe-btn {
      flex: 1;
      background: linear-gradient(45deg, #e17055, #d63031);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .view-recipe-btn:hover {
      transform: scale(1.02);
    }

    .back-btn {
      background: transparent;
      color: #3b241a;
      border: 1px solid #3b241a;
      padding: 0px 8px;
      font-size: 24px;
      font-weight: 600;
      line-height: 1;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .no-ingredients {
      text-align: center;
      padding: 40px;
      opacity: 0.7;
    }

    .error-message {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid rgba(231, 76, 60, 0.5);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }

    @media (max-width: 768px) {
      .title {
        font-size: 2rem;
      }

      .recipes-grid {
        grid-template-columns: 1fr;
      }

      .search-controls {
        flex-direction: column;
        width: 100%;
      }

      .search-btn {
        width: 100%;
      }

      /* Make action buttons easier to tap on phones */
      .view-recipe-btn {
        width: 100%;
        display: block;
        padding: 12px 16px;
        margin-top: 8px;
        border-radius: 10px;
      }

      .back-btn {
        position: static;
        width: 100%;
        margin-top: 16px;
        right: auto;
        bottom: auto;
        border-radius: 10px;
      }

      /* On mobile, hide the explicit prev/next controls and floating back button to rely on gestures */
      .stack-controls {
        display: none !important;
      }

      .back-btn {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="back-btn" onclick="goBack()">⬅</button>

    <div class="header">
      <h1 class="title"><span class="title-emoji">🍽️</span> Find Your Soulplate</h1>
      <p class="subtitle">Swipe to find love!</p>
    </div>

    <div class="ingredients-section">
      <h2 class="ingredients-title">
        🥬 Your Ingredients
        <span id="ingredientCount">(0)</span>
      </h2>

      <div id="ingredientsList" class="ingredients-list">
        <!-- Ingredients will be populated here -->
      </div>

      <div id="noIngredients" class="no-ingredients" style="display: none;">
        <p>No ingredients found. Please go back and select some ingredients first!</p>
      </div>

      <div class="search-controls">
        <button id="findRecipesBtn" class="search-btn" onclick="findRecipes()">
          🔍 Find Recipes
        </button>
      </div>

      <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>

    <div id="loadingSection" class="loading" style="display: none;">
      <p>🔍 Searching for delicious recipes...</p>
    </div>

    <div id="recipesSection" class="recipes-section" style="display: none;">
      <h2 class="ingredients-title">🍳 Recommended Recipes</h2>
      <div id="recipesGrid" class="recipes-grid">
        <!-- Recipes will be populated here -->
      </div>
      <div class="stack-controls" aria-hidden="false">
        <button id="prevCardBtn">◀️ Prev</button>
        <button id="nextCardBtn">Next ▶️</button>
      </div>
    </div>
  </div>

  <script>
    // Replace with your Spoonacular API key

    // const SPOONACULAR_API_KEY = '140f9ddf755e480d8c6ce473d447be89';
    // const OPENAI_API_KEY = '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';

    let currentIngredients = [];
    let foundRecipes = [];
    let currentOffset = 0;
    let isLoadingMore = false;
    let hasMoreRecipes = true;

    function showStatus(message, type) {
      status.textContent = message;
      status.className = `status ${type}`;
    }
    // Get ingredients from URL parameters or localStorage
    function getIngredients() {
      // Try URL parameters first (from camera page)
      const urlParams = new URLSearchParams(window.location.search);
      const urlIngredients = urlParams.get('ingredients');

      if (urlIngredients) {
        try {
          return JSON.parse(decodeURIComponent(urlIngredients));
        } catch (e) {
          console.log('Failed to parse URL ingredients');
        }
      }

      // Try localStorage (from insert page)
      const savedIngredients = localStorage.getItem('selectedIngredients');
      if (savedIngredients) {
        try {
          return JSON.parse(savedIngredients);
        } catch (e) {
          console.log('Failed to parse saved ingredients');
        }
      }

      return [];
    }

    function displayIngredients() {
      currentIngredients = getIngredients();
      const ingredientsList = document.getElementById('ingredientsList');
      const ingredientCount = document.getElementById('ingredientCount');
      const noIngredients = document.getElementById('noIngredients');
      const findRecipesBtn = document.getElementById('findRecipesBtn');

      if (currentIngredients.length === 0) {
        noIngredients.style.display = 'block';
        ingredientsList.style.display = 'none';
        findRecipesBtn.disabled = true;
        return;
      }

      ingredientCount.textContent = `(${currentIngredients.length})`;
      ingredientsList.innerHTML = currentIngredients.map(ingredient => `
        <div class="ingredient-tag">
          <span>${ingredient.emoji || '🥘'}</span>
          <span>${ingredient.name}</span>
        </div>
      `).join('');
    }

    async function findRecipes() {
      if (currentIngredients.length === 0) return;

      const findRecipesBtn = document.getElementById('findRecipesBtn');
      const loadingSection = document.getElementById('loadingSection');
      const recipesSection = document.getElementById('recipesSection');
      const errorMessage = document.getElementById('errorMessage');

      findRecipesBtn.disabled = true;
      loadingSection.style.display = 'block';
      recipesSection.style.display = 'none';
      errorMessage.style.display = 'none';
      currentOffset = 0;
// openAI API
      try {
        const ingredientNames = currentIngredients.map(ing => ing.name).join(',');
        const url = 'https://api.openai.com/v1/chat/completions';

        const response = await fetch( url, {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${OPENAI_API_KEY}`},
            body: JSON.stringify({
              model: 'gpt-4o-mini', 
              messages: [{role: 'user', content: [{type: 'text', text: ingredientNames}, {type: 'text', text: "Analyze these ingredients, Give me a recipe with just these ingredients."}]}], 
              max_tokens: 300, temperature: 0.3})});

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(`API Error: ${response.status} - ${errorData.error?.message || 'Unknown error'}`);
        }

        const recipes = await response.json();
        const recipe = recipes.choices[0].message.content
        console.log(recipe)

        } catch (error) {
          console.error('Error analyzing food:', error);

          let errorMessage = 'Failed to analyze food. ';
          if (error.message.includes('401')) {
            errorMessage += 'Invalid API key. Please check your OpenAI API key.';
          } else if (error.message.includes('429')) {
            errorMessage += 'Rate limit exceeded. Please try again later.';
          } else if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
            errorMessage += 'Network error. Please check your internet connection.';
          } else {
            errorMessage += error.message;
          }

        showStatus(errorMessage, 'error');
      }
// spoonacular API
      try {
        const ingredientNames = currentIngredients.map(ing => ing.name).join(',');
        const url = `https://api.spoonacular.com/recipes/findByIngredients?apiKey=${SPOONACULAR_API_KEY}&ingredients=${encodeURIComponent(ingredientNames)}&number=6&ranking=2&ignorePantry=false`;

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        const recipes = await response.json();
        if (recipes && recipes.length > 0) {
          foundRecipes = recipes;
          await displayRecipes(recipes);
          recipesSection.style.display = 'block';

          // Initialize infinite scroll
          initializeInfiniteScroll();
        } else {
          showError('No recipes found with your ingredients. Try adding more ingredients!');
        }

      } catch (error) {
        console.error('Error finding recipes:', error);
        showError('Failed to find recipes. Please check your internet connection and API key.');
      }

      loadingSection.style.display = 'none';
      findRecipesBtn.disabled = false;
    }

    // Add these new functions:
    function initializeInfiniteScroll() {
      window.addEventListener('scroll', handleScroll);
    }

    function handleScroll() {
      if (isLoadingMore || !hasMoreRecipes) return;

      // Check if user scrolled near bottom (200px from bottom)
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
        loadMoreRecipes();
      }
    }

    async function loadMoreRecipes() {
      if (isLoadingMore || !hasMoreRecipes) return;

      isLoadingMore = true;
      currentOffset += 6;

      try {
        const ingredientNames = currentIngredients.map(ing => ing.name).join(',');
        const url = `https://api.spoonacular.com/recipes/findByIngredients?apiKey=${SPOONACULAR_API_KEY}&ingredients=${encodeURIComponent(ingredientNames)}&number=6&offset=${currentOffset}&ranking=2&ignorePantry=false`;

        const response = await fetch(url);
        const recipes = await response.json();

        if (recipes && recipes.length > 0) {
          foundRecipes = [...foundRecipes, ...recipes];
          await displayRecipes(recipes, true); // append = true
        } else {
          hasMoreRecipes = false; // No more recipes available
        }

      } catch (error) {
        console.error('Error loading more recipes:', error);
        hasMoreRecipes = false;
      }

      isLoadingMore = false;
    }

    async function displayRecipes(recipes, append = false) {
      const recipesGrid = document.getElementById('recipesGrid');

      if (!append) {
        recipesGrid.innerHTML = '';
      }

      for (const recipe of recipes) {
        const recipeCard = createRecipeCard(recipe);
        // add stack-card class for stacking
        recipeCard.classList.add('stack-card');
        recipesGrid.appendChild(recipeCard);
      }

      // Reset stack index on initial render
      if (!append) {
        stackIndex = 0;
      }

      // Initialize/update stack behavior so appended cards are included
      initializeCardStack();
    }

    async function displayRecipes(recipes) {
      const recipesGrid = document.getElementById('recipiesGrid');
      recipesGrid.innerHTML = ' ';
      for (const recipe of recipes) {
        const recipeCard = createRecipeCard(recipe);
        recipesGrid.appendChild(recipeCard);
      }
    }

    function createRecipeCard(recipe) {
      const card = document.createElement('div');
      card.className = 'recipe-card';
      // store recipe id and url on the card for swipe actions
      card.dataset.recipeId = recipe.id;
      card.dataset.recipeUrl = `https://spoonacular.com/recipes/-${recipe.id}`;

      const missingCount = recipe.missedIngredientCount || 0;
      const usedCount = recipe.usedIngredientCount || 0;

      card.innerHTML = `
        <img src="${recipe.image}" alt="${recipe.title}" class="recipe-image" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZGRkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMTgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj7wn42iIFJlY2lwZTwvdGV4dD48L3N2Zz4='">
        <div class="recipe-content">
          <h3 class="recipe-title">${recipe.title}</h3>
          <div class="recipe-meta">
            <span>✅ Uses ${usedCount} ingredients</span>
            <span>❌ Missing ${missingCount}</span>
          </div>
          <div class="recipe-ingredients">
            <div class="recipe-ingredients-title">Used Ingredients:</div>
            <div class="recipe-ingredients-list">
              ${(recipe.usedIngredients || []).slice(0, 5).map(ing =>
                `<span class="recipe-ingredient">${ing.name}</span>`
              ).join('')}
              ${recipe.usedIngredients && recipe.usedIngredients.length > 5 ?
                `<span class="recipe-ingredient">+${recipe.usedIngredients.length - 5} more</span>` : ''}
            </div>
          </div>
          <div class="recipe-actions">
            <button class="view-recipe-btn" onclick="viewRecipe(${recipe.id})">
              👀 View Recipe
            </button>
          </div>
        </div>
      `;

      // add a close button for expanded mode; will be shown only when expanded
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-expanded-btn';
      closeBtn.setAttribute('aria-label', 'Close');
      closeBtn.textContent = '✕';
      closeBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        collapseCard(card);
      });
      card.appendChild(closeBtn);

      return card;
    }

    // Helper to animate and remove a specific card to a given side
    function removeCard(card, direction = 'left') {
      if (!card) return;
      card.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
      if (direction === 'right') {
        card.style.transform = 'translateX(120%) rotate(12deg)';
      } else {
        card.style.transform = 'translateX(-120%) rotate(-12deg)';
      }
      card.style.opacity = '0';
      setTimeout(() => {
        if (card && card.parentNode) card.parentNode.removeChild(card);
        initializeCardStack();
      }, 360);
    }

    function viewRecipe(recipeId) {
      // Open recipe in new tab using Spoonacular's recipe page
      window.open(`https://spoonacular.com/recipes/-${recipeId}`, '_blank');
    }

    // Stack implementation (top card is always first in DOM)
    function initializeCardStack() {
      const cards = Array.from(document.querySelectorAll('.recipes-grid .stack-card'));
      const controls = document.querySelector('.stack-controls');

      // show controls when cards exist
      if (controls) controls.style.display = cards.length ? 'flex' : 'none';

      // position and style each card (top is index 0)
      cards.forEach((card, i) => {
        const offset = i; // top card 0, next 1, ...
        const scale = Math.max(0.92, 1 - offset * 0.04);
        const y = offset * 14; // vertical offset
        const rot = offset * -2; // subtle rotation
        card.style.zIndex = String(1000 - i);
        card.style.opacity = offset > 4 ? '0' : '1';
        card.style.transform = `translateY(${y}px) scale(${scale}) rotate(${rot}deg)`;
        card.dataset.index = i;
        card.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
        addDragHandlers(card);
      });
    }

    function removeTopCard() {
      const cards = Array.from(document.querySelectorAll('.recipes-grid .stack-card'));
      if (cards.length === 0) return;
      const top = cards[0];
      removeCard(top, 'left');
    }

    // Expand a card to fullscreen (mobile-friendly). Adds .expanded and hides body scroll.
    function expandCard(card) {
      if (!card) return;
      // collapse any currently expanded card first
      const currently = document.querySelector('.recipes-grid .stack-card.expanded');
      if (currently && currently !== card) collapseCard(currently);

      card.classList.add('expanded');
      // lock body scroll while expanded
      document.body.style.overflow = 'hidden';
      // ensure the card is focused for keyboard users
      card.setAttribute('tabindex', '-1');
      card.focus();
    }

    function collapseCard(card) {
      if (!card) return;
      card.classList.remove('expanded');
      document.body.style.overflow = '';
      try { card.removeAttribute('tabindex'); } catch (e) {}
      // reinitialize stack positions
      initializeCardStack();
    }

    function showNextCard() {
      removeTopCard();
    }

    function showPrevCard() {
      // Not supported after deletion of top cards; keep as no-op or could implement undo stack
      // For now, do nothing
      return;
    }

    // Drag/swipe handlers (mouse + touch)
    function addDragHandlers(card) {
      let startX = 0, currentX = 0, dragging = false;

      function onStart(e) {
        // only allow dragging of the top card
        const idx = Number(card.dataset.index || 0);
        if (idx !== 0) return;
        dragging = true;
        startX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        card.style.transition = 'none';
      }

      function onMove(e) {
        if (!dragging) return;
        currentX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const dx = currentX - startX;
        card.style.transform = `translateX(${dx}px) rotate(${dx * 0.02}deg)`;
      }

      function onEnd(e) {
        if (!dragging) return;
        dragging = false;
        const dx = currentX - startX;
        card.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
        // If swiped sufficiently to the left, remove top card
        if (dx < -80) {
          removeCard(card, 'left');
        } else if (dx > 80) {
          // Right swipe: on mobile expand the card, on desktop open link
          const isMobile = window.innerWidth <= 768 || (('ontouchstart' in window) && navigator.maxTouchPoints > 0);
          if (isMobile) {
            expandCard(card);
          } else {
            const url = card.dataset.recipeUrl;
            if (url) window.open(url, '_blank');
            removeCard(card, 'right');
          }
        } else {
          // reset position
          initializeCardStack();
        }
      }

      card.addEventListener('mousedown', onStart);
      card.addEventListener('touchstart', onStart, {passive: true});
      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove, {passive: true});
      window.addEventListener('mouseup', onEnd);
      window.addEventListener('touchend', onEnd);
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') showNextCard();
      if (e.key === 'ArrowLeft' || e.key === 'a') showPrevCard();
    });

    function showError(message) {
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    function goBack() {
      // Go back to the insert ingredients page
      window.location.replace('insert.html');
    }

    // Initialize page when loaded
    window.addEventListener('load', () => {
      displayIngredients();

      // Auto-search if we have ingredients
      if (currentIngredients.length > 0) {
        // Small delay to let the page render
        setTimeout(() => {
          findRecipes();
        }, 500);
      }
    });

    // Wire stack control buttons (delegated in case they are added later)
    document.addEventListener('click', (e) => {
      if (e.target && e.target.id === 'nextCardBtn') {
        showNextCard();
      }
      if (e.target && e.target.id === 'prevCardBtn') {
        showPrevCard();
      }
    });
  </script>
</body>
</html>
