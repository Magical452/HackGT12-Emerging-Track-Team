    const APP_ID = 'YOUR_CLIENT_ID_HERE';
    const APP_KEY = 'YOUR_CLIENT_SECRET_HERE';

    const dropdown = document.getElementById('dropdown');
    const selectionBox = document.getElementById('selectionBox');

    let searchTimeout = null;

    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('keydown', handleKeydown);
    document.addEventListener('click', closeDropdown);

    function handleSearch(e) {
      const query = e.target.value.toLowerCase().trim();

      // Clear previous timeout
      if (searchTimeout) {
        clearTimeout(searchTimeout);
      }

      if (query === '' || query.length < 2) {
        hideDropdown();
        return;
      }

      // Add delay to avoid too many API calls
      searchTimeout = setTimeout(() => {
        searchIngredients(query);
      }, 300);
    }

    async function searchIngredients(query) {
      try {
        showLoading();

        // Try using a CORS proxy or fallback to local search
        // Option 1: Try with CORS proxy (may not always work)
        const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
        const apiUrl = `https://api.edamam.com/api/food-database/v2/parser?app_id=${APP_ID}&app_key=${APP_KEY}&ingr=${encodeURIComponent(query)}&nutrition-type=cooking-basic&category=generic-foods`;

        let response;

        try {
          // First attempt with CORS proxy
          response = await fetch(proxyUrl + apiUrl, {
            headers: {
              'X-Requested-With': 'XMLHttpRequest',
            }
          });

          if (!response.ok) {
            throw new Error('CORS proxy failed');
          }

          const data = await response.json();

          if (data.hints && data.hints.length > 0) {
            const ingredients = data.hints.slice(0, 8).map(hint => ({
              name: hint.food.label,
              emoji: getIngredientEmoji(hint.food.label, hint.food.category),
              category: hint.food.category || 'Unknown',
              foodId: hint.food.foodId,
              nutrients: hint.food.nutrients
            }));

            showDropdown(ingredients);
            return;
          }
        } catch (corsError) {
          console.log('CORS proxy failed, using fallback database');
        }

        // Fallback to enhanced local database search
        searchLocalIngredients(query);

      } catch (error) {
        console.error('Error searching ingredients:', error);
        searchLocalIngredients(query); // Always fallback to local search
      }
    }

    function getIngredientEmoji(name, category) {
      const lowerName = name.toLowerCase();

      // Emoji mapping based on ingredient name or category
      const emojiMap = {
        // Vegetables
        'tomato': '🍅', 'onion': '🧅', 'garlic': '🧄', 'pepper': '🫑',
        'carrot': '🥕', 'broccoli': '🥦', 'spinach': '🥬', 'lettuce': '🥬',
        'cucumber': '🥒', 'mushroom': '🍄', 'potato': '🥔', 'corn': '🌽',
        'avocado': '🥑', 'eggplant': '🍆',

        // Proteins
        'chicken': '🐔', 'beef': '🥩', 'pork': '🐷', 'fish': '🐟',
        'salmon': '🐟', 'shrimp': '🦐', 'egg': '🥚', 'tofu': '🟡',
        'bean': '🫘', 'chickpea': '🫛',

        // Fruits
        'apple': '🍎', 'banana': '🍌', 'orange': '🍊', 'lemon': '🍋',
        'lime': '🟢', 'strawberry': '🍓', 'blueberry': '🫐',

        // Dairy
        'milk': '🥛', 'cheese': '🧀', 'butter': '🧈', 'yogurt': '🥛',

        // Grains
        'rice': '🌾', 'flour': '🌾', 'bread': '🍞', 'pasta': '🌾',
        'oat': '🌾', 'quinoa': '🌾',

        // Others
        'oil': '🫒', 'honey': '🍯', 'sugar': '🟰', 'salt': '🧂',
        'herb': '🌿', 'spice': '🌶️', 'nut': '🥜', 'seed': '🌰'
      };

      // Check for specific ingredient names first
      for (const [key, emoji] of Object.entries(emojiMap)) {
        if (lowerName.includes(key)) {
          return emoji;
        }
      }

      // Fallback based on category
      if (category) {
        const categoryLower = category.toLowerCase();
        if (categoryLower.includes('vegetable')) return '🥬';
        if (categoryLower.includes('fruit')) return '🍎';
        if (categoryLower.includes('meat') || categoryLower.includes('protein')) return '🥩';
        if (categoryLower.includes('dairy')) return '🥛';
        if (categoryLower.includes('grain') || categoryLower.includes('cereal')) return '🌾';
      }

      return '🥘'; // Default emoji
    }

    }

    function showNoResults() {

      dropdown.style.display = 'block';
    }

    function showError(message) {
      dropdown.innerHTML = `<div class="dropdown-item">⚠️ ${message}</div>`;
      dropdown.style.display = 'block';
    }

    function showDropdown(ingredients) {
      dropdown.innerHTML = '';
      currentHighlight = -1;

      ingredients.forEach((ingredient, index) => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.innerHTML = `
          <span class="food-emoji">${ingredient.emoji}</span>
          <div>
            <div>${ingredient.name}</div>
            <small style="opacity: 0.7;">${ingredient.category}</small>
          </div>
        `;
        item.addEventListener('click', () => selectFood(ingredient));
        dropdown.appendChild(item);
      });

      dropdown.style.display = 'block';
    }

    function hideDropdown() {
      dropdown.style.display = 'none';
      currentHighlight = -1;
    }

    function handleKeydown(e) {
      const items = dropdown.querySelectorAll('.dropdown-item');

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        currentHighlight = Math.min(currentHighlight + 1, items.length - 1);
        highlightItem();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        currentHighlight = Math.max(currentHighlight - 1, -1);
        highlightItem();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (currentHighlight >= 0 && items[currentHighlight]) {
          items[currentHighlight].click();
        }
      } else if (e.key === 'Escape') {
        hideDropdown();
      }
    }

    function highlightItem() {
      const items = dropdown.querySelectorAll('.dropdown-item');
      items.forEach((item, index) => {
        item.classList.toggle('highlighted', index === currentHighlight);
      });
    }

    function selectFood(ingredient) {
      // Check if ingredient is already selected
      if (selectedFoods.find(f => f.name === ingredient.name)) {
        return;
      }

      selectedFoods.push(ingredient);
      updateSelectionBox();
      searchInput.value = '';
      hideDropdown();
    }

    function removeFood(index) {
      selectedFoods.splice(index, 1);
      updateSelectionBox();
    }

    function updateSelectionBox() {
      const mealPlanBtn = document.getElementById('mealPlanBtn');
      const ingredientCount = document.getElementById('ingredientCount');

      if (selectedFoods.length === 0) {
        selectionBox.className = 'selection-box empty';
        selectionBox.innerHTML = '<p>No ingredients selected yet. Search and select ingredients above.</p>';
        if (mealPlanBtn) mealPlanBtn.disabled = true;
        if (ingredientCount) ingredientCount.textContent = '(0 ingredients)';
      } else {
        selectionBox.className = 'selection-box has-selection';
        selectionBox.innerHTML = selectedFoods.map((ingredient, index) => `
          <div class="selected-food">
            <span class="selected-food-emoji">${ingredient.emoji}</span>
            <div class="selected-food-info">
              <div class="selected-food-name">${ingredient.name}</div>
              <div class="selected-food-category">${ingredient.category}</div>
            </div>
            <button class="remove-btn" onclick="removeFood(${index})">✕</button>
          </div>

        `).join('');
        if (mealPlanBtn) mealPlanBtn.disabled = false;
        if (ingredientCount) ingredientCount.textContent = `(${selectedFoods.length} ingredient${selectedFoods.length !== 1 ? 's' : ''})`;
      }
      // Save ingredients to localStorage
      localStorage.setItem('selectedIngredients', JSON.stringify(selectedFoods));
    }


     function goToMealPlan() {
      if (selectedFoods.length === 0) {
        alert('Please select some ingredients first!');
        return;
      }
      //return what was asked
      // Save ingredients to local Storage
      localStorage.setItem('selectedIngredients', JSON.stringify(selectedFoods));
      window.location.href = 'mealplan.html';
    }

    function closeDropdown(e) {
      if (!e.target.closest('.search-section')) {
        hideDropdown();
      }
    }

    function goBack() {
      window.location.href = 'index.html'; // or whatever your main page is called
    }
