<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Hackathon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      height: 100%;
      background: linear-gradient(135deg, #FFC5CF 0%, #BF808B 100%);
      background-attachment: fixed;
      background-size: cover;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin: 0;
      padding: 24px 12px 48px;
      background: transparent;
    }

    .hero {
      width: 100%;
      padding: 28px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-inner {
      max-width: 1000px;
      text-align: center;
      color: #341a1a;
      background: rgba(255,255,255,0.08);
      padding: 18px 22px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .hero h1 {
      font-size: 28px;
      color: #2d1b4a; /* dark purple */
      margin-bottom: 8px;
    }

    .blurb {
      color: rgba(20,18,24,0.85);
      font-size: 15px;
      line-height: 1.4;
      margin: 0;
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 1100px;
      margin: 24px auto 0;
      gap: 28px;
      justify-content: center;
      align-items: stretch;
    }

    .button {
      color: white;
      border: none;
      font-size: 32px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      flex: 1 1 48%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      min-height: 220px;
      border-radius: 18px;
    }

    .button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .button:hover::before {
      left: 100%;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
      background: linear-gradient(45deg, #ff5252, #d63031);
    }

    .button:active {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .button.camera {
      background: linear-gradient(44deg, #6c5ce7, #a29bfe);
    }

    .button.camera:hover {
      background: linear-gradient(46deg, #a29bfe, #6c5ce7);
    }

    .button.insert {
      background: linear-gradient(45deg, #dd6161, #9e3737);
    }

    .button.insert:hover {
      background: linear-gradient(45deg, #9e3737, #dd6161);
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        gap: 18px;
        padding: 0 12px;
        align-items: stretch;
      }

      .button {
        width: 100%;
        max-width: none;
        margin: 8px 0;
        height: auto;
        min-height: 64px;
        font-size: 20px;
        padding: 14px 18px;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>FoodFindr</h1>
      <p class="blurb">Take a picture of your ingredients or write them as a list. Then, you can start swiping to find your soulplate!</p>
    </div>
  </header>
  <div class="container">
    <button class="button camera" onclick="useCamera()">
      📷 Use Camera
    </button>

    <button class="button insert" onclick="insertFile()">
      ✍🏻 List
    </button>
  </div>

  <script>
    function useCamera() {
      window.location.href = 'camera.html';
      // Add your camera logic here
    }

    function insertFile() {
      window.location.href = 'insert.html';
      // Add your file insertion logic here
    }
  </script>
</body>
</html>
