<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TasteFindr — Home</title>
  <link rel="stylesheet" href="mobile.css">
  <style>
    /* Minimal page-specific tweaks */
    .hero-wrapper{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
    .home-actions{display:flex;gap:18px;align-items:center;justify-content:center;width:100%;max-width:900px}
    .home-actions .card{flex:1;display:flex;align-items:center;justify-content:center;height:220px;border-radius:20px;font-size:22px;font-weight:700;text-transform:uppercase}
    @media (max-width:600px){.home-actions{flex-direction:column}.home-actions .card{height:140px;font-size:18px;border-radius:14px}}
  </style>
</head>
<body>
  <main class="hero-wrapper">
    <div class="home-actions">
      <button class="card camera btn-primary" onclick="useCamera()">📷 Use Camera</button>
      <button class="card insert btn-primary" onclick="insertFile()">📁 Insert</button>
    </div>
  </main>

  <script>
    function useCamera(){ window.location.href = 'camera.html'; }
    function insertFile(){ window.location.href = 'insert.html'; }
  </script>
</body>
</html>
