<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera - Food Hackathon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
      background-size: cover;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      background: transparent;
    }

    .camera-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #video {
      width: 100%;
      max-width: 640px;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      background: #000;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: linear-gradient(45deg, #00b894, #00a085);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn.stop {
      background: linear-gradient(45deg, #e17055, #d63031);
    }

    .btn.capture {
      background: linear-gradient(45deg, #fdcb6e, #e17055);
    }

    .btn.analyze {
      background: linear-gradient(45deg, #6c5ce7, #a29bfe);
    }

    .btn.back {
      background: linear-gradient(45deg, #6c5ce7, #a29bfe);
    }

    .status {
      margin-bottom: 20px;
      padding: 10px 20px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      text-align: center;
    }

    .error {
      background: rgba(231, 76, 60, 0.3);
    }

    .success {
      background: rgba(46, 204, 113, 0.3);
    }

    .loading {
      background: rgba(241, 196, 15, 0.3);
    }

    canvas {
      display: none;
    }

    .captured-image {
      margin-top: 20px;
      max-width: 300px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .analysis-section {
      margin-top: 25px;
      width: 100%;
      max-width: 600px;
    }

    .ingredients-header {
      background: rgba(255, 255, 255, 0.15);
      padding: 15px 20px;
      border-radius: 10px 10px 0 0;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    .ingredients-list {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 0 0 10px 10px;
      padding: 0;
      margin: 0;
      list-style: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      max-height: 300px;
      overflow-y: auto;
    }

    .ingredients-list li {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      transition: background 0.2s ease;
    }

    .ingredients-list li:last-child {
      border-bottom: none;
    }

    .ingredients-list li:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .ingredients-list li:before {
      content: "🥘";
      margin-right: 10px;
      font-size: 16px;
    }

    .raw-response {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 20px;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .raw-response-header {
      font-weight: bold;
      margin-bottom: 10px;
      color: #fff;
      font-size: 16px;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid #fff;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        width: 100%;
        gap: 12px;
        padding: 0 10px;
      }

      .btn {
        width: 100%;
        padding: 14px 18px;
        font-size: 18px;
        border-radius: 12px;
      }

      .captured-image {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="camera-container">
    <div id="status" class="status">Click "Start Camera" to begin</div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="controls">
      <button id="startBtn" class="btn">📷 Start Camera</button>
      <button id="stopBtn" class="btn stop" style="display: none;">⏹️ Stop Camera</button>
      <button id="captureBtn" class="btn capture" style="display: none;">📸 Capture Photo</button>
      <button id="analyzeBtn" class="btn analyze" style="display: none;">🔍 Analyze Food</button>
      <button id="backBtn" class="btn back">⬅️ Back to Main</button>
    </div>

    <img id="capturedImage" class="captured-image" style="display: none;" />

    <div id="analysisSection" class="analysis-section" style="display: none;">
      <div class="ingredients-header">
        🍽️ Detected Ingredients
      </div>
      <ul id="ingredientsList" class="ingredients-list">
      </ul>

      <div class="raw-response">
        <div class="raw-response-header">Full Analysis:</div>
        <div id="rawResponse"></div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const captureBtn = document.getElementById('captureBtn');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const backBtn = document.getElementById('backBtn');
    const status = document.getElementById('status');
    const capturedImage = document.getElementById('capturedImage');
    const analysisSection = document.getElementById('analysisSection');
    const ingredientsList = document.getElementById('ingredientsList');
    const rawResponse = document.getElementById('rawResponse');

    let stream = null;
    let currentImageData = null;

    // *** ADD YOUR OPENAI API KEY HERE ***
    const OPENAI_API_KEY = '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'; // Replace with your actual API key

    // Check if getUserMedia is supported
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('Camera access is not supported by this browser', 'error');
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    captureBtn.addEventListener('click', capturePhoto);
    analyzeBtn.addEventListener('click', analyzeFood);
    backBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    async function startCamera() {
      try {
        showStatus('Requesting camera access...', 'status');

        // Request camera access
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'environment' // Use back camera on mobile if available
          },
          audio: false
        });

        video.srcObject = stream;

        showStatus('Camera is active', 'success');
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        captureBtn.style.display = 'inline-block';

      } catch (error) {
        console.error('Error accessing camera:', error);
        let errorMessage = 'Failed to access camera. ';

        if (error.name === 'NotAllowedError') {
          errorMessage += 'Permission denied. Please allow camera access.';
        } else if (error.name === 'NotFoundError') {
          errorMessage += 'No camera found on this device.';
        } else {
          errorMessage += error.message;
        }

        showStatus(errorMessage, 'error');
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      showStatus('Camera stopped', 'status');

      startBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
      captureBtn.style.display = 'none';
      analyzeBtn.style.display = 'none';

      // Hide captured content
      capturedImage.style.display = 'none';
      analysisSection.style.display = 'none';
      currentImageData = null;
    }

    function capturePhoto() {
      if (!stream) return;

      // Set canvas dimensions to match video
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // Draw the video frame to canvas
      context.drawImage(video, 0, 0);

      // Convert canvas to image data URL
      currentImageData = canvas.toDataURL('image/png');

      // Display the captured image
      capturedImage.src = currentImageData;
      capturedImage.style.display = 'block';

      // Show analyze button
      analyzeBtn.style.display = 'inline-block';

      showStatus('Photo captured successfully! Click "Analyze Food" to identify ingredients.', 'success');

      // Hide previous analysis
      analysisSection.style.display = 'none';
    }

    // *** THIS IS THE NEW FUNCTION - Direct OpenAI API call ***
    async function analyzeFood() {
      if (!currentImageData) {
        showStatus('No photo to analyze. Please capture a photo first.', 'error');
        return;
      }

      // Show loading state
      analyzeBtn.disabled = true;
      analyzeBtn.innerHTML = '<div class="spinner"></div>Analyzing...';
      showStatus('🔍 Analyzing your food image...', 'loading');

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [
              {
                role: 'user',
                content: [
                  {
                    type: 'text',
                    text: 'Analyze the image, list all food ingredients you can identify.'
                  },
                  {
                    type: 'image_url',
                    image_url: {
                      url: currentImageData
                    }
                  }
                ]
              }
            ],
            max_tokens: 300,
            temperature: 0.3
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(`API Error: ${response.status} - ${errorData.error?.message || 'Unknown error'}`);
        }

        const data = await response.json();
        const ingredientsText = data.choices[0].message.content;

        displayResults(ingredientsText);
        showStatus('✅ Food analysis complete!', 'success');

      } catch (error) {
        console.error('Error analyzing food:', error);

        let errorMessage = 'Failed to analyze food. ';
        if (error.message.includes('401')) {
          errorMessage += 'Invalid API key. Please check your OpenAI API key.';
        } else if (error.message.includes('429')) {
          errorMessage += 'Rate limit exceeded. Please try again later.';
        } else if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
          errorMessage += 'Network error. Please check your internet connection.';
        } else {
          errorMessage += error.message;
        }

        showStatus(errorMessage, 'error');
      } finally {
        // Reset analyze button
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = '🔍 Analyze Food';
      }
    }

    function displayResults(ingredientsText) {
      // Show the full response
      rawResponse.textContent = ingredientsText;

      // Parse ingredients into a list
      const ingredients = parseIngredients(ingredientsText);

      // Clear previous results
      ingredientsList.innerHTML = '';

      // Add each ingredient as a list item
      ingredients.forEach(ingredient => {
        const li = document.createElement('li');
        li.textContent = ingredient;
        ingredientsList.appendChild(li);
      });

      // Show the results section
      analysisSection.style.display = 'block';
    }

    function parseIngredients(text) {
      // Try to extract ingredients from the GPT response
      const ingredients = [];

      // Split by common delimiters and clean up
      const lines = text.split(/[\n\r•\-\*]/);

      lines.forEach(line => {
        const cleaned = line.trim();
        if (cleaned &&
            !cleaned.toLowerCase().startsWith('i can see') &&
            !cleaned.toLowerCase().startsWith('the image') &&
            !cleaned.toLowerCase().startsWith('based on') &&
            !cleaned.toLowerCase().includes('appears to') &&
            cleaned.length > 2) {

          // Remove numbering (1., 2., etc.)
          const withoutNumbers = cleaned.replace(/^\d+\.?\s*/, '');

          // Remove common prefixes
          const withoutPrefixes = withoutNumbers
            .replace(/^(ingredients?:?|contains?:?)\s*/i, '')
            .replace(/^-\s*/, '');

          if (withoutPrefixes.trim()) {
            ingredients.push(withoutPrefixes.trim());
          }
        }
      });

      // If we didn't find structured ingredients, try comma-separated
      if (ingredients.length === 0) {
        const commaSplit = text.split(',');
        commaSplit.forEach(item => {
          const cleaned = item.trim();
          if (cleaned && cleaned.length > 2) {
            ingredients.push(cleaned);
          }
        });
      }

      // Fallback: if still no ingredients, just show the full text as one item
      if (ingredients.length === 0) {
        ingredients.push(text.trim());
      }

      return ingredients;
    }

    function showStatus(message, type) {
      status.textContent = message;
      status.className = `status ${type}`;
    }

    // Handle page visibility changes (stop camera when page is hidden)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && stream) {
        stopCamera();
      }
    });
  </script>
</body>
</html>
