<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera - Food Hackathon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FFC5CF 0%, #BF808B 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .camera-container {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  /* balanced container width: large enough but not huge */
  width: min(92vw, 1000px);
  max-width: 1000px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative; /* allow absolute children like the back button */
    }

    #video {
      width: 100%;
      max-width: 900px; /* moderate video area */
      height: auto;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      background: #000;
    }

    /* Responsive: keep it compact on small screens */
    @media (max-width: 480px) {
      .camera-container { max-width: 90vw; padding: 18px; }
      #video { max-width: 100%; }
      .status { max-width: 80%; }
    }

    /* On very large screens, constrain the video width proportionally */
    @media (min-width: 1600px) {
      #video { max-width: 1400px; }
      .camera-container { max-width: 1500px; }
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      padding: 0 32px; /* horizontal spacing preserved; vertical padding handled by container */
      width: 100%;
      position: static; /* keep container as the positioned ancestor */
      height: 56px; /* fixed header height to keep vertical alignment consistent */
    }

    .back-btn {
      background: linear-gradient(45deg, #6c5ce7, #a29bfe);
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: absolute; /* position relative to .camera-container */
      left: 12px; /* small inset from the container left edge */
      top: 24px; /* align with header vertical position */
    }

    .back-btn:hover {
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .back-btn:focus {
      outline: 3px solid rgba(108,92,231,0.35);
      outline-offset: 3px;
    }

    .status {
      /* center visually without affecting flow so back button won't overlap */
      position: absolute;
      left: 50%;
      top: 24px; /* align with the back button */
      transform: translateX(-50%);
      max-width: 80%;
      text-align: center;
      margin: 0;
      font-size: 18px;
      /* default to truncation; JS will enable wrapping if container capped */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .btn {
      background: linear-gradient(45deg, #00b894, #00a085);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .btn.stop {
      background: linear-gradient(45deg, #e17055, #d63031);
    }

    .btn.capture {
      background: linear-gradient(45deg, #fdcb6e, #e17055);
    }

    .btn.back {
      background: linear-gradient(45deg, #6c5ce7, #a29bfe);
    }

    /* Make the primary start button match the purple/blue theme */
    #startBtn {
      background: linear-gradient(45deg, #6c5ce7, #a29bfe);
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    }

    #startBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    }

    .status {
      margin-bottom: 20px;
      padding: 6px 8px;
      border-radius: 8px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.2);
      color: #6c5ce7;
      text-align: center;
    }

    .error {
      background: rgba(231, 76, 60, 0.3);
    }

    .success {
      background: rgba(46, 204, 113, 0.3);
    }

    canvas {
      display: none;
    }

    .captured-image {
      margin-top: 20px;
      max-width: 300px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="camera-container">

    <div class="header-row">
      <button id="backBtn" class="back-btn" aria-label="Go back">⬅</button>
      <div id="status" class="status">Click "Turn On Camera" to begin</div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="controls">
      <button id="startBtn" class="btn">📷 Turn On Camera</button>
      <button id="stopBtn" class="btn stop" style="display: none;">⏹️ Stop Camera</button>
      <button id="captureBtn" class="btn capture" style="display: none;">📸 Capture Photo</button>
      <!-- <button id="backBtn" class="btn back">⬅️ Back to Main</button> commented out bc the back button I added isn't working and this is the old one-->
    </div>

    <img id="capturedImage" class="captured-image" style="display: none;" />
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const captureBtn = document.getElementById('captureBtn');
    // backBtn element is defined in the markup with id="backBtn"
    const backBtn = document.getElementById('backBtn');
    const status = document.getElementById('status');
    const capturedImage = document.getElementById('capturedImage');

    let stream = null;

    // Check if getUserMedia is supported
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('Camera access is not supported by this browser', 'error');
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    captureBtn.addEventListener('click', capturePhoto);
    backBtn.addEventListener('click', () => {
      window.location.href = 'index.html'; // or whatever your main page is called
    });

    // Adjust camera container width so back button + status/title fit on one line
    const container = document.querySelector('.camera-container');

    function adjustContainerWidth() {
      if (!container || !backBtn || !status) return;

      const computed = window.getComputedStyle(container);
      const padLeft = parseFloat(computed.paddingLeft) || 0;
      const padRight = parseFloat(computed.paddingRight) || 0;

      // gap between back button and status (header-row gap)
      const headerRow = document.querySelector('.header-row');
      const gap = headerRow ? parseFloat(window.getComputedStyle(headerRow).gap) || 16 : 16;

      const backW = Math.ceil(backBtn.getBoundingClientRect().width);

      // status.scrollWidth gives the width needed to display the status without truncation
      const statusW = Math.ceil(status.scrollWidth);

  // extra buffer so it doesn't touch edges
  const buffer = 90;

      let required = padLeft + backW + gap + statusW + padRight + buffer;

      // enforce sensible min/max (match CSS limits)
      const maxAllowed = Math.min(window.innerWidth * 0.95, 1000);
      const minAllowed = 320; // don't go too small

      if (required < minAllowed) required = minAllowed;

      if (required > maxAllowed) {
        // cannot fit everything in bounds: cap width and allow status to wrap
        container.style.width = maxAllowed + 'px';
        status.style.whiteSpace = 'normal';
        status.style.textOverflow = 'clip';
      } else {
        container.style.width = required + 'px';
        status.style.whiteSpace = 'nowrap';
        status.style.textOverflow = 'ellipsis';
      }

      // Position back button aligned with the left edge of the video element
      try {
        const containerRect = container.getBoundingClientRect();
        const videoRect = video.getBoundingClientRect();

        let leftOffset;
        if (videoRect && videoRect.width > 2) {
          // if video has layout, align to its left edge
          leftOffset = Math.max(8, Math.round(videoRect.left - containerRect.left + 4));
        } else {
          // fallback: compute centered video left based on container width and video max-width
          const videoMax = parseFloat(window.getComputedStyle(video).maxWidth) || container.clientWidth;
          const videoWidth = Math.min(container.clientWidth, videoMax);
          leftOffset = Math.max(8, Math.round((container.clientWidth - videoWidth) / 2) + 4);
        }

        backBtn.style.left = leftOffset + 'px';
      } catch (e) {
        // ignore measurement errors
      }
    }

    // Run on load and on resize
    window.addEventListener('load', adjustContainerWidth);
    window.addEventListener('resize', () => {
      // debounce resizing slightly
      clearTimeout(window._adjustContainerTimer);
      window._adjustContainerTimer = setTimeout(adjustContainerWidth, 120);
    });

    // Observe status text changes (so dynamic status updates re-run sizing)
    const mo = new MutationObserver(adjustContainerWidth);
    mo.observe(status, { childList: true, characterData: true, subtree: true });

    // initial adjust in case script runs after load
    adjustContainerWidth();

  // re-adjust when the video element has metadata (dimensions) or plays
  video.addEventListener('loadedmetadata', adjustContainerWidth);
  video.addEventListener('play', adjustContainerWidth);

    async function startCamera() {
      try {
        showStatus('Requesting camera access...', 'status');

        // Request camera access
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'environment' // Use back camera on mobile if available
          },
          audio: false
        });

        video.srcObject = stream;

        showStatus('Camera is active', 'success');
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        captureBtn.style.display = 'inline-block';

      } catch (error) {
        console.error('Error accessing camera:', error);
        let errorMessage = 'Failed to access camera. ';

        if (error.name === 'NotAllowedError') {
          errorMessage += 'Permission denied. Please allow camera access.';
        } else if (error.name === 'NotFoundError') {
          errorMessage += 'No camera found on this device.';
        } else {
          errorMessage += error.message;
        }

        showStatus(errorMessage, 'error');
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      showStatus('Camera stopped', 'status');

      startBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
      captureBtn.style.display = 'none';
    }

    function capturePhoto() {
      if (!stream) return;

      // Set canvas dimensions to match video
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // Draw the video frame to canvas
      context.drawImage(video, 0, 0);

      // Convert canvas to image data URL
      const imageDataURL = canvas.toDataURL('image/png');

      // Display the captured image
      capturedImage.src = imageDataURL;
      capturedImage.style.display = 'block';

      showStatus('Photo captured successfully!', 'success');

      // You can also save or process the image here
      // For example, send it to a server or download it
    }

    function showStatus(message, type) {
      status.textContent = message;
      status.className = `status ${type}`;
    }

    // Handle page visibility changes (stop camera when page is hidden)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && stream) {
        stopCamera();
      }
    });
  </script>
</body>
</html>
